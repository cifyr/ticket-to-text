name: TicketToText
options:
  bundleIdPrefix: com.cadenwarren
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: "NO"
    DEVELOPMENT_TEAM: "LP92N2QT42"
    CODE_SIGN_STYLE: Automatic
targets:
  TicketToText:
    type: application.messages
    platform: iOS
    sources:
      - ios/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sachinsagrawal.tickettotext
        INFOPLIST_FILE: ios/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: MessagesExtension
        embed: true
    scheme:
      testTargets: []
  MessagesExtension:
    type: app-extension.messages
    platform: iOS
    sources:
      - ios/MessagesExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sachinsagrawal.tickettotext.MessagesExtension
        INFOPLIST_FILE: ios/MessagesExtension/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
        TARGETED_DEVICE_FAMILY: "1,2"
